
name: Deploy Apache Website to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-devops-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform and Ansible Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Azure authentication using OIDC
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # SSH public key is stored in GitHub Secrets
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      # STEP 1 - Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2 - Validate SSH public key
      - name: Validate SSH Public Key
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PUBLIC_KEY" ]; then
            echo "::error::SSH_PUBLIC_KEY is missing or empty"
            exit 1
          fi

          if [[ ! "$SSH_PUBLIC_KEY" =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-) ]]; then
            echo "::error::Invalid SSH public key format"
            exit 1
          fi

          echo "SSH public key is configured"

      # STEP 3 - Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # STEP 4 - Setup Python
      - name: Setup Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STEP 5 - Install Ansible
      - name: Install Ansible
        run: |
          python -m pip install ansible
          ansible --version

      # STEP 6 - Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # STEP 7 - Get runner public IP
      - name: Get GitHub Runner Public IP
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS -4 https://api.ipify.org)

          if [ -z "$RUNNER_IP" ]; then
            echo "::error::Failed to discover runner public IP"
            exit 1
          fi

          echo "TF_VAR_ssh_source_cidr=$RUNNER_IP/32" >> "$GITHUB_ENV"
          echo "Runner public IP: $RUNNER_IP"

      # STEP 8 - Initialize Terraform remote state
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=azure-devops-lab.tfstate"

      # STEP 9 - Validate Terraform
      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform fmt 
          terraform validate

            # STEP 10 - Inspect Terraform State
      - name: Inspect Terraform State
        working-directory: terraform
        run: |
          set -euo pipefail

          echo "Checking whether remote state exists..."

          STATE_EXISTS=$(az storage blob exists \
            --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.TFSTATE_CONTAINER }}" \
            --name "azure-devops-lab.tfstate" \
            --auth-mode login \
            --query exists \
            -o tsv)

          if [ "$STATE_EXISTS" = "true" ]; then
            echo "Terraform state exists."
            terraform state list
          else
            echo "No state exists yet."
            echo "This may be the first deployment."
          fi

      # STEP 11 - Import existing resource group if needed
            # STEP 11 - Import Existing Resource Group
     
      - name: Reconcile Existing Azure Lab Resources
        working-directory: terraform
        run: |
          set -euo pipefail

          RG="rg-ansible-github-lab"
          SUB_ID=$(az account show --query id -o tsv)
          BASE="/subscriptions/$SUB_ID/resourceGroups/$RG"

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state list 2>/dev/null | grep -Fxq "$address"; then
              echo "Already in state: $address"
            elif az resource show --ids "$resource_id" \
              --query id -o tsv >/dev/null 2>&1; then
              echo "Importing: $address"
              terraform import -input=false \
                "$address" "$resource_id"
            else
              echo "Not found in Azure: $address"
            fi
          }

          import_if_missing \
            "azurerm_resource_group.rg" \
            "$BASE"

          import_if_missing \
            "azurerm_virtual_network.vnet" \
            "$BASE/providers/Microsoft.Network/virtualNetworks/vnet-lab"

          import_if_missing \
            "azurerm_network_security_group.nsg" \
            "$BASE/providers/Microsoft.Network/networkSecurityGroups/nsg-web-lab"

          import_if_missing \
            "azurerm_public_ip.pip" \
            "$BASE/providers/Microsoft.Network/publicIPAddresses/pip-web-lab"

          import_if_missing \
            "azurerm_subnet.subnet" \
            "$BASE/providers/Microsoft.Network/virtualNetworks/vnet-lab/subnets/subnet-web"

          import_if_missing \
            "azurerm_network_interface.nic" \
            "$BASE/providers/Microsoft.Network/networkInterfaces/nic-web-lab"

          NIC_ID="$BASE/providers/Microsoft.Network/networkInterfaces/nic-web-lab"
          NSG_ID="$BASE/providers/Microsoft.Network/networkSecurityGroups/nsg-web-lab"

          if terraform state list 2>/dev/null | grep -Fxq \
            "azurerm_network_interface_security_group_association.association"; then
            echo "NIC/NSG association already tracked"
          elif az network nic show \
            --resource-group "$RG" \
            --name "nic-web-lab" \
            --query "networkSecurityGroup.id" -o tsv \
            | grep -Fqi "$NSG_ID"; then

            terraform import -input=false \
              "azurerm_network_interface_security_group_association.association" \
              "$NIC_ID|$NSG_ID"
          fi

          echo "State reconciliation finished"
          terraform state list

      # STEP 12 - Verify Terraform state after import
           # STEP 12 - Verify Terraform State
      - name: Verify Terraform State
        working-directory: terraform
        run: |
          echo "Terraform-managed resources:"
          terraform state list
      # STEP 13 - Terraform Plan
      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      # STEP 14 - Terraform Apply
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

      # STEP 15 - Retrieve Azure VM information
      - name: Get Azure VM Details
        run: |
          set -euo pipefail

          VM_IP=$(terraform -chdir=terraform output -raw vm_public_ip)
          VM_NAME=$(terraform -chdir=terraform output -raw vm_name)
          VM_RG=$(terraform -chdir=terraform output -raw resource_group_name)

          if [ -z "$VM_IP" ] || [ -z "$VM_NAME" ] || [ -z "$VM_RG" ]; then
            echo "::error::Terraform VM outputs are missing"
            exit 1
          fi

          echo "VM_IP=$VM_IP" >> "$GITHUB_ENV"
          echo "VM_NAME=$VM_NAME" >> "$GITHUB_ENV"
          echo "VM_RG=$VM_RG" >> "$GITHUB_ENV"

          echo "VM IP: $VM_IP"
          echo "VM Name: $VM_NAME"
          echo "Resource Group: $VM_RG"

      # STEP 16 - Configure SSH private key
      - name: Configure SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is missing"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "SSH private key configured"

      # STEP 17 - Retrieve SSH host key through Azure
      - name: Verify Azure VM SSH Host Key
        run: |
          set -euo pipefail

          HOST_INFO=$(az vm run-command invoke \
            --resource-group "$VM_RG" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "cat /etc/ssh/ssh_host_ed25519_key.pub" \
            --query "value[0].message" \
            -o tsv)

          HOST_KEY=$(printf '%s\n' "$HOST_INFO" \
            | grep '^ssh-ed25519 ' \
            | head -n 1 || true)

          if [ -z "$HOST_KEY" ]; then
            echo "::error::Unable to retrieve SSH host key"
            exit 1
          fi

          printf '%s %s\n' "$VM_IP" "$HOST_KEY" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH host key registered"

      # STEP 18 - Generate Ansible inventory
      - name: Generate Ansible Inventory
        run: |
          set -euo pipefail

          mkdir -p ansible

          cat > ansible/inventory.ini <<EOF
          [webservers]
          vm1 ansible_host=$VM_IP ansible_user=azureuser ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519
          EOF

          echo "Generated Ansible inventory:"
          cat ansible/inventory.ini

      # STEP 19 - Wait for SSH connectivity
      - name: Wait for VM SSH
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              azureuser@"$VM_IP" \
              "echo SSH ready"; then

              echo "SSH connection successful"
              exit 0
            fi

            echo "Waiting for SSH ($attempt/30)"
            sleep 5
          done

          echo "::error::SSH connection failed"
          exit 1

      # STEP 20 - Wait for cloud-init
      - name: Wait for Cloud Init
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            azureuser@"$VM_IP" \
            "sudo cloud-init status --wait"

      # STEP 21 - Test Ansible connectivity
      - name: Test Ansible Connectivity
        run: |
          ansible webservers \
            -i ansible/inventory.ini \
            -m ansible.builtin.ping

      # STEP 22 - Deploy Apache using Ansible
      - name: Deploy Apache Using Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml

      # STEP 23 - Verify deployed website
      - name: Verify Website
        run: |
          set -euo pipefail

          curl \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://$VM_IP/" \
            | tee website-response.html

          grep -q "Deployed with Terraform" website-response.html

          echo "Website deployment verified successfully!"
